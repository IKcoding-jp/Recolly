version: 2
updates:
  # minor・patch更新と脆弱性修正をそれぞれ1本のPRにまとめる。
  # メジャー更新は破壊的変更を含むため、従来どおり個別のPRで出す。
  - package-ecosystem: "bundler"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/scripts/posthog"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
